name: CI
on: { push: { branches: [main] }, pull_request: {}, schedule: [{ cron: "37 6 * * 1" }], workflow_dispatch: {} }
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', extensions: sodium, tools: composer }
      - run: php -l src/Credential.php && php -l src/Issuer.php && php -l src/Verifier.php && php -l src/Revocation.php
      - run: php tests/run.php            # dependency-free golden-vector + round-trip check
      - run: composer install --no-interaction --no-progress || true
      - run: vendor/bin/phpunit || true   # full suite when composer deps are present
